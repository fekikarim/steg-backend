spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true

logging:
  level:
    root: INFO
    tn.steg.backend: INFO
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production exposure lockdown (security review task): the API contract is a
# build-time artifact for the three clients, not a public surface — springdoc
# above is disabled entirely, and the actuator keeps ONLY the load-balancer
# health probe. info/metrics/prometheus (and every sensitive endpoint) are
# unexposed in production; the dev/test profile keeps them for local work.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

steg:
  security:
    jwt:
      issuer: steg-platform
      access-token-expiration-minutes: ${JWT_ACCESS_EXP_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:7}
      secret-key: ${STEG_JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

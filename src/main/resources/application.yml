spring:
  application:
    name: steg-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA & Hibernate Defaults
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration


# Management & Observability (Actuator)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    enabled: true

# Custom STEG Platform Properties (Externalized)
steg:
  security:
    jwt:
      issuer: steg-platform
      access-token-expiration-minutes: ${JWT_ACCESS_EXP_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_EXP_DAYS:7}
      secret-key: ${STEG_JWT_SECRET}
    lockout:
      max-failed-attempts: ${LOCKOUT_MAX_ATTEMPTS:5}
      duration-minutes: ${LOCKOUT_DURATION_MINUTES:30}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-root-path: ${STORAGE_LOCAL_ROOT:./storage/uploads}
    max-file-size-mb: 25
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 0
        order_inserts: false
        order_updates: false
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    tn.steg.backend: INFO
    org.testcontainers: INFO
    org.flywaydb: INFO
